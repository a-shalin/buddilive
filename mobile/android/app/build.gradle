plugins {
	id "com.android.application"
	id "org.jetbrains.kotlin.android"
}

def productionInventoryFile = file("../../../ansible/inventory/production.ini")

def resolveProductionDomainName = {
	if (!productionInventoryFile.exists()) {
		return null
	}

	def domainLine = productionInventoryFile.readLines().find {
		it.trim().startsWith("domain_name=")
	}
	if (domainLine == null) {
		return null
	}

	def value = domainLine.split("=", 2)[1].trim()
	return value.isEmpty() ? null : value
}

def releaseDomainName = resolveProductionDomainName()
def releaseBaseUrl = releaseDomainName != null ? "https://${releaseDomainName}/" : "https://missing-domain.invalid/"
def autoVersionCode = (int) (System.currentTimeMillis() / 1000L)

def androidKeystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def androidKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def androidKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def androidKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigningConfig = [androidKeystoreFile, androidKeyAlias, androidKeystorePassword, androidKeyPassword]
	.every { it != null && !it.trim().isEmpty() }

android {
	namespace "ca.digitalcave.buddilive.mobile"
	compileSdk 34

	signingConfigs {
		if (hasReleaseSigningConfig) {
			release {
				storeFile file(androidKeystoreFile)
				storePassword androidKeystorePassword
				keyAlias androidKeyAlias
				keyPassword androidKeyPassword
			}
		}
	}

	defaultConfig {
		applicationId "ca.digitalcave.buddilive.mobile"
		minSdk 26
		targetSdk 34
		versionCode autoVersionCode
		versionName "0.1.0"
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
	}

	buildTypes {
		debug {
			applicationIdSuffix ".debug"
			versionNameSuffix "-debug"
			buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:8080/\""
		}
		release {
			if (hasReleaseSigningConfig) {
				signingConfig signingConfigs.release
			}
			minifyEnabled false
			proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
			buildConfigField "String", "BASE_URL", "\"${releaseBaseUrl}\""
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	kotlinOptions {
		jvmTarget = "17"
	}

	buildFeatures {
		buildConfig true
		compose true
	}

	composeOptions {
		kotlinCompilerExtensionVersion "1.5.14"
	}

	packaging {
		resources {
			excludes += "/META-INF/{AL2.0,LGPL2.1}"
		}
	}
}

tasks.register("validateReleaseSigning") {
	doLast {
		if (!hasReleaseSigningConfig) {
			throw new GradleException("Missing Android release signing config. Set ANDROID_KEYSTORE_FILE, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD in environment.")
		}
		if (!file(androidKeystoreFile).exists()) {
			throw new GradleException("Android keystore file not found: ${androidKeystoreFile}")
		}
	}
}

tasks.register("validateReleaseDomainName") {
	doLast {
		if (releaseDomainName == null) {
			throw new GradleException("Missing domain_name in ansible/inventory/production.ini. Release APK requires production domain.")
		}
	}
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
	dependsOn(tasks.named("validateReleaseSigning"))
	dependsOn(tasks.named("validateReleaseDomainName"))
}

dependencies {
	def composeBom = platform("androidx.compose:compose-bom:2024.09.00")

	implementation composeBom
	androidTestImplementation composeBom
	androidTestImplementation "androidx.test.ext:junit:1.2.1"
	androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
	androidTestImplementation "androidx.compose.ui:ui-test-junit4"

	implementation "androidx.core:core-ktx:1.13.1"
	implementation "androidx.activity:activity-compose:1.9.2"
	implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
	implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.6"
	implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
	implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6"
	implementation "androidx.compose.ui:ui"
	implementation "androidx.compose.ui:ui-text-google-fonts"
	implementation "androidx.compose.ui:ui-tooling-preview"
	implementation "androidx.compose.material:material-icons-extended"
	implementation "androidx.compose.material3:material3"
	implementation "androidx.navigation:navigation-compose:2.8.2"
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
	implementation "com.squareup.okhttp3:okhttp:4.12.0"
	implementation "com.squareup.retrofit2:retrofit:2.11.0"
	implementation "com.squareup.retrofit2:converter-gson:2.11.0"

	debugImplementation "androidx.compose.ui:ui-tooling"
	debugImplementation "androidx.compose.ui:ui-test-manifest"
}
