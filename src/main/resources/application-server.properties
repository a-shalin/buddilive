# Production database (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-test-query=select 1

# Mail
buddi.mail.smtp.from=${EMAIL}
buddi.mail.smtp.host=${MAIL_HOST}
buddi.mail.smtp.port=${MAIL_PORT}
buddi.mail.smtp.auth=${MAIL_AUTH}
buddi.mail.smtp.username=${EMAIL}
buddi.mail.smtp.password=${MAIL_PASSWORD}
buddi.mail.smtp.starttls.enable=${MAIL_TLS}
