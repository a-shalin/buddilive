# Server
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# MyBatis
mybatis.mapper-locations=classpath:ca/digitalcave/buddi/live/db/*.xml
mybatis.type-handlers-package=ca.digitalcave.buddi.live.db.handler

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/master.xml

# Multipart (for restore file upload)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# HikariCP defaults
spring.datasource.hikari.connection-test-query=${DB_QUERY:select 1}
spring.datasource.hikari.idle-timeout=1800000
spring.datasource.hikari.max-lifetime=600000
