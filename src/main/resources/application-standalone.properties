# Standalone mode — embedded Derby for local users
buddi.directRegistration=true
spring.datasource.driver-class-name=org.apache.derby.iapi.jdbc.AutoloadedDriver
spring.datasource.url=jdbc:derby:directory:buddilive-data;create=true
spring.datasource.hikari.connection-test-query=VALUES 1

# Mail (optional — users may configure)
buddi.mail.smtp.from=${EMAIL:}
buddi.mail.smtp.host=smtp.gmail.com
buddi.mail.smtp.port=587
buddi.mail.smtp.auth=true
buddi.mail.smtp.username=${EMAIL:}
buddi.mail.smtp.password=${MAIL_PASSWORD:}
buddi.mail.smtp.starttls.enable=true
