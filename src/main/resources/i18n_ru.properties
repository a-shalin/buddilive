CONFIRM_CHANGE_EXISTING_TRANSACTION_TITLE=Изменение существующей транзакции
CONFIRM_CHANGE_EXISTING_TRANSACTION=Вы изменяете основные атрибуты существующей транзакции.  Вы уверены, что хотите сделать это?  Нажмите 'Да' для продолжения или 'Нет' для отмены.<br/><br/>Если вы хотели добавить новую транзакцию, нажмите кнопку 'Очистить' перед добавлением новой транзакции.<br/>
CONFIRM_DATE_OUT_OF_RANGE_AFTER=Указанная дата более чем на один месяц в будущем.  Вы уверены, что это верно?  Нажмите 'Да' для продолжения с этой датой или 'Нет' для отмены.
CONFIRM_DATE_OUT_OF_RANGE_BEFORE=Указанная дата более чем на один год в прошлом.  Вы уверены, что это верно?  Нажмите 'Да' для продолжения с этой датой или 'Нет' для отмены.
CONFIRM_DATE_OUT_OF_RANGE_TITLE=Дата вне допустимого диапазона
CONFIRM_DELETE_ACCOUNT=Вы уверены, что хотите удалить этот счет?<br/>Если есть связанные транзакции, счет будет лишь помечен как удаленный (его можно восстановить позднее при желании).<br/>Если транзакций нет, счет будет удален навсегда.
CONFIRM_DELETE_CATEGORY=Вы уверены, что хотите удалить эту категорию бюджета?<br/>Если есть связанные транзакции, категория будет лишь помечена как удаленная (ее можно восстановить позднее при желании).<br/>Если транзакций нет, категория будет удалена навсегда.
CONFIRM_DELETE_DATA=Флажок "Удалить данные" выбран, и все существующие данные будут удалены перед восстановлением из резервной копии.  Это действие нельзя отменить.  Вы уверены, что хотите продолжить?
CONFIRM_DELETE_SCHEDULED=Вы уверены, что хотите удалить эту регулярную транзакцию?  После удаления транзакции больше не будут создаваться автоматически.  Уже добавленные транзакции останутся.
CONFIRM_DELETE_TRANSACTION=Вы уверены, что хотите удалить эту транзакцию?  Это действие нельзя отменить.
CONFIRM_DELETE_USER=Удалив учетную запись, вы больше не сможете входить в Buddi Live, и все ранее введенные данные будут окончательно потеряны.<br/><br/>Настоятельно рекомендуется скачать резервную копию данных перед удалением учетной записи; это позволит восстановить данные, если вы откроете новую учетную запись.<br/><br/>Вы действительно хотите удалить свою учетную запись Buddi Live?  Нажмите 'Да' для окончльного удаления или 'Нет' для отмены.<br/>
CONFIRM_DELETE_USER2=Вы уверены, что хотите удалить свою учетную запись и все данные из системы?  Это действие нельзя отменить.<br/><br/>Нажмите 'Да' для окончательного удаления учетной записи Buddi Live или 'Нет' для отмены.<br/>
COOKIES_USED_MESSAGE=Buddi Live использует Cookies для входа пользователей.  Поэтму cookies необходимы для работы сайта.<br/><br/>Нажимая Yes, вы соглашаетесь, что этот сайт может сохранять cookies в вашем браузере.<br/><br/>Подробнее см. <a href='doc/termsandconditions.html'>Условия использования</a>.
COPY_FROM_PREVIOUS_BUDGET_PERIOD_TOOLTIP=Копировать записи бюджета из предыдущего периода в текущий
COPY_FROM_PREVIOUS_BUDGET_PERIOD=Копировать записи бюджета
CREATE_USER_AGREEMENT_REQUIRED=Вы должны согласиться с условиями использования перед созданием учетной записи
HELP_ACCOUNT_EDITOR_NAME=Название счета. Это должно быть описательное имя, которое уникально идентифицирует счет. Примеры названий: "ABC Сбережения", "Visa Premium", "Наличные в кошельке" и т. д.
HELP_ACCOUNT_EDITOR_STARTING_BALANCE=Начальный баланс — сумма денег на счете при первом вводе в Buddi. Обычно эту сумму не следует менять после первоначальной настройки.
HELP_BUDGET_CATEGORY_NAME=Это название группы общих транзакций. Например, категория "Продукты" может отслеживать покупки еды; категория "Дом" — различные бытовые расходы, такие как мебель и простой ремонт; категория "Зарплата" — доход от ежемесячной зарплаты.<br/>Чтобы группировать связанные категории, используйте функцию "Родительская категория" ниже.
HELP_BUDGET_CATEGORY_PARENT=Родительская категория используется для группировки связанных категорий бюджета. Например, есть категория "Расходы на автомобиль". Тогда можно добавить категории "Топливо", "Страхование", "Обслуживание и ремонт" с родительской категорией "Расходы на автомобиль". После этого эти категории будут показаны под родительской категорией "Расходы на автомобиль".
HELP_BUDGET_CATEGORY_PERIOD_TYPE=Период бюджета, который назначается категории. "Период бюджета" — повторяющийся диапазон дат, для которого вы задаете сумму в бюджете; например, категорию для ежемесячного налога на недвижимость следует назначить с периодом "Месяц".
HELP_CLEAR_TRANSACTION=Очищает все поля в редакторе транзакции и снимает выделение с выбранной транзакции (если применимо).
HELP_CURRENCY=Валюта для всех транзакций. Отображается в соответствии с выбранной локалью.
HELP_DATE_FORMAT=Можно переопределить формат даты для выбранной локали. Оставьте значение "Использовать локаль по умолчанию", чтобы использовать формат даты выбранной локали.
HELP_DELETE_DATA=Если выбрано, все существующие данные будут удалены перед восстановлением. Это действие нельзя отменить. Обратите внимание: восстановление поверх существующих данных не продублирует все — процедура восстановления добавляет только новое из файла резервной копии.
HELP_DELETE_TRANSACTION=Удаляет текущую выбранную транзакцию.
HELP_ENCRYPT_DATA=Этот параметр определяет, будут ли эта учетная запись и ее чувствительные данные зашифрованы. Если включено, Buddi Live зашифрует некоторые поля данных, включая названия счетов и категорий, описания транзакций и т. д. Шифрование защищает конфиденциальность в случае утечки данных.<br/><br/>Однако учтите, что у этого шифрования нет обходных путей: при включении шифрования нет возможности сброса пароля, и при его потере данные становятся полностью невосстановимыми.<br/><br/>Подробнее см. на <a href='doc/encryption.html' target='_blank'>странице информации о шифровании Buddi Live</a>.
HELP_ENCRYPT_DATA_PASSWORD=Для обеспечения безопасности данных необходимо ввести пароль, чтобы изменить настройки шифрования.
HELP_END_DATE=Используется с интервалом 'другое'. Дата окончания интервала отчета.
HELP_GETTING_STARTED=<b>Добро пожаловать в Buddi Live!</b><br/><br/>Если вы уже пользовались Buddi для рабочего стола, вы можете экспортировать транзакции, выбрав File &rarr; Export &rarr; Export Buddi Live data. Этот файл можно импортировать в Buddi Live через System &rarr; Restore, выбрав созданный .json файл.<br/><br/>Если вы новичок, вы можете <a href='doc/tutorial.html' target='_blank'>посмотреть учебник</a> для начала работы.<br/><br/>Чтобы включить шифрование или изменить локаль и форматирование, выберите System &rarr; Preferences.<br/><br/>Это сообщение будет показываться при запуске, пока вы не добавите хотя бы один счет. Вы можете открыть его снова через System &rarr; Getting Started.
HELP_GETTING_STARTED_TITLE=Начало работы
HELP_INTERVAL_PICKER=Интервал дат для этого отчета. Выберите предустановленный интервал или задайте собственные даты начала и окончания.
HELP_LOCALE=Язык/страна для локализации. Локализация включает язык, формат символа валюты, формат даты и чисел по умолчанию и т. д.
HELP_RECORD_UPDATE_TRANSACTION=Записать (или обновить) текущую выбранную транзакцию. В редакторе транзакции можно нажать Ctrl + Enter как быстрый способ.
HELP_REGISTER=Введите действительный адрес электронной почты и нажмите "Generate Key".
HELP_REGISTER_2=Проверьте почту на ключ активации. Когда он придет, скопируйте его сюда, выберите пароль и нажмите "Новый счет".<br/><br/>После создания учетной записи вы сможете войти с адресом электронной почты и паролем.
HELP_REPEATING_BIWEEKLY=Настройте повторение транзакции раз в две недели в указанный день недели.
HELP_REPEATING_EVERY_X_DAYS=Повторять транзакцию через указанное число дней. Значение должно быть больше 0.
HELP_REPEATING_MONTHLY=Повторять транзакцию каждый месяц в указанный день месяца. Учтите, что не во всех месяцах есть 31 день; используйте "Последний день" для автоматической корректировки.
HELP_REPEATING_MONTHLY_BY_DAY_OF_WEEK=Повторять транзакцию каждый месяц в указанный день недели.
HELP_REPEATING_MULTIPLE_MONTHS_EVERY_YEAR=Повторять транзакцию в указанный день месяца в указанные месяцы года.
HELP_REPEATING_MULTIPLE_WEEKS_EVERY_MONTH=Повторять транзакцию в указанный день недели в указанные недели месяца.
HELP_REPEATING_WEEKLY=Повторять транзакцию каждую неделю в указанный день недели.
HELP_RESET_PASSWORD=Введите email для входа, чтобы получить временный ключ для сброса пароля.<br/><br/>Сброс возможен только если шифрование не включено. Если учетная запись зашифрована, восстановить пароль невозможно и ключ активации вы не получите.
HELP_RESET_PASSWORD_2=Когда ключ активации придет на почту, скопируйте его сюда и выберите новый пароль.<br/><br/>Если ваша учетная запись зашифрована, восстановить пароль невозможно, и ключ активации вы не получите.
HELP_RESTORE_FILE=Загрузите файл, ранее сохраненный Buddi Live, или файл, экспортированный в Buddi Live из настольной версии Buddi. Обычно это .json, и если файл создан Buddi Live, он называется 'backup.json'.
HELP_SCHEDULED_TRANSACTION_END_DATE=День, когда эта регулярная транзакция должна завершиться. Оставьте пустым, чтобы не задавать дату окончания (можно изменить позже).
HELP_SCHEDULED_TRANSACTION_MESSAGE=Сообщение, которое будет показано при срабатывании регулярной транзакции. Сообщение показывается при входе. Оставьте пустым, чтобы ничего не показывать.
HELP_SCHEDULED_TRANSACTION_NAME=Название регулярной транзакции. Должно быть достаточно описательным, чтобы понимать назначение. Например: "Ежемесячный перевод в сбережения", "Личные карманные", и т. п.
HELP_SCHEDULED_TRANSACTION_REPEAT=Выберите частоту повторения этой регулярной транзакции. В зависимости от расписания ниже могут отображаться разные параметры.
HELP_SCHEDULED_TRANSACTION_START_DATE=День, когда эта регулярная транзакция должна начаться.
HELP_SCHEDULED_TRANSACTION_TRANSACTION=Транзакция, которая будет автоматически добавляться по указанному расписанию. Как минимум укажите описание, сумму и источник/получатель.
HELP_START_DATE=Используется с интервалом 'другое'. Дата начала интервала отчета.
HELP_STORE_EMAIL=Этот параметр определяет, будет ли Buddi Live хранить логин/адрес электронной почты в восстановимом виде.<br/><br/>Если адрес можно восстановить, это позволяет, например, отправлять системные письма. Если не хранить адрес в восстановимом виде, пользователи, заботящиеся о приватности, могут оставаться более анонимными.<br/><br/>Подробнее о хранении данных см. на <a href='doc/encryption.html' target='_blank'>странице информации о шифровании Buddi Live</a>.
HELP_USE_TWO_FACTOR=Использовать двухфакторную аутентификацию. Это позволяет сканировать QR-код в приложении-аутентификаторе на телефоне (например, Google Authenticator, Authy и т. д.). Приложение будет генерировать 6-значный код при каждом входе.<br/><br/>Это дополнительный фактор, снижающий риск несанкционированного доступа даже при известном пароле.<br/><br/>После включения флажка вам будет предложено настроить 2FA. После настройки нужно вводить код двухфакторной аутентификации при каждом входе.
