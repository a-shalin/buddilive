# Android E2E profile — fresh embedded Derby for each test run
buddi.directRegistration=true
spring.datasource.driver-class-name=org.apache.derby.iapi.jdbc.AutoloadedDriver
spring.datasource.url=jdbc:derby:directory:target/androide2e-derby;create=true
spring.datasource.hikari.connection-test-query=VALUES 1

# Mail disabled for Android E2E
buddi.mail.smtp.from=test@example.com
buddi.mail.smtp.host=localhost
buddi.mail.smtp.port=8025
buddi.mail.smtp.auth=false
buddi.mail.smtp.username=
buddi.mail.smtp.password=
buddi.mail.smtp.starttls.enable=false
