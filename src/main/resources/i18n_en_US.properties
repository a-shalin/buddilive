ACCOUNT_EDITOR_ACCOUNT_TYPE_EXAMPLES=Checking, Savings, Credit Cards, etc
HELP_ACCOUNT_EDITOR_ACCOUNT_TYPE=The high level categorization of the account.  This is a freeform label which allows grouping of similar accounts together.  Examples include "Checking", "Savings", "Credit Cards", etc.
HELP_ACCOUNT_EDITOR_TYPE=Whether this account is a "Debit" or "Credit" account.  Debit accounts are for accounts which have money: things such as Savings, Checking, Cash in Wallet, etc.  Credit accounts are for accounts which owe money: things such as Credit Cards, Loans, etc.
NUMBER=Check / Transaction Number

SHOW_CURRENCY_SYMBOL=Show Currency Symbol
SPACE_BETWEEN_CURRENCY_AND_AMOUNT=Space Between Currency and Amount
SEPARATOR_DOT=dot
SEPARATOR_COMMA=comma
SEPARATOR_SPACE=space
SEPARATOR_APOSTROPHE=apostrophe
DECIMAL_SEPARATOR=Decimal Separator
THOUSAND_SEPARATOR=Thousand Separator
NEGATIVE_FORMAT=Negative Format
NEGATIVE_FORMAT_SIGN=Minus Sign: -123.45
NEGATIVE_FORMAT_BRACKETS=Brackets: (123.45)

HELP_DECIMAL_SEPARATOR=Override the decimal separator used when formatting amounts. Leave as "Use Locale Defaults" to use the locale setting.
HELP_THOUSAND_SEPARATOR=Override the thousands separator used when formatting amounts. Leave as "Use Locale Defaults" to use the locale setting.
HELP_NEGATIVE_FORMAT=Choose how negative amounts are displayed. You can use a minus sign or brackets.
