---
- name: Deploy BuddiLive
  hosts: webservers
  gather_facts: false

  tasks:
    - name: Verify Docker is installed
      ansible.builtin.command: docker --version
      changed_when: false

    - name: Verify Docker Compose plugin is installed
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Verify shared edge network exists
      ansible.builtin.command: docker network inspect edge
      changed_when: false

    - name: Clean app directory (keep only expected files)
      ansible.builtin.shell:
        cmd: >
          find ~/{{ app_name }}/ -mindepth 1 -maxdepth 1
          ! -name 'buddilive.jar'
          ! -name 'Dockerfile'
          ! -name 'docker-compose.yml'
          ! -name '.env'
          -exec rm -rf {} +
        chdir: "~/{{ app_name }}"
      failed_when: false
      changed_when: false

    - name: Create app directory
      ansible.builtin.file:
        path: "~/{{ app_name }}"
        state: directory
        mode: "0755"

    - name: Copy JAR file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../target/buddilive.jar"
        dest: "~/{{ app_name }}/buddilive.jar"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/Dockerfile"
        dest: "~/{{ app_name }}/Dockerfile"

    - name: Copy .env file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../.env"
        dest: "~/{{ app_name }}/.env"
        mode: "0600"

    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../docker/docker-compose.yml.j2"
        dest: "~/{{ app_name }}/docker-compose.yml"

    - name: Deploy with Docker Compose
      ansible.builtin.command:
        cmd: docker compose up --build --force-recreate --remove-orphans -d
        chdir: "~/{{ app_name }}"

    - name: Install Postgres backup to S3 script
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/pg_backup_to_s3.sh.j2"
        dest: "~/pg_backup_to_s3.sh"
        mode: "0700"

    - name: Set up daily Postgres backup cron job
      ansible.builtin.cron:
        name: "Daily Postgres backup to S3"
        minute: "15"
        hour: "2"
        job: "~/pg_backup_to_s3.sh >> ~/pg_backup_to_s3.log 2>&1"
